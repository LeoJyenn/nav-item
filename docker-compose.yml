version: '3'

services:
  nav-item:
    image: leojyenn/nav-item:latest
    container_name: nav-item
    ports:
      - "127.0.0.1:3000:3000"   # 只绑定本机回环，外网无法直连，由反向代理对外提供服务
    volumes:
      - ./data:/app/data        # 持久化：数据库 + JWT密钥 + 上传文件 + 运行日志
    restart: unless-stopped
    # 如需自定义初始管理员账号（仅首次建库时生效），取消注释：
    # environment:
    #   - ADMIN_USERNAME=admin
    #   - ADMIN_PASSWORD=你的强密码
